# 強制指定生產環境伺服器埠口
server.port=8080

# 資料庫設定：直接使用記憶體資料庫，完全不依賴外部檔案與 Dialect
spring.datasource.url=jdbc:h2:mem:miniclinicdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 每次啟動都強制執行 schema.sql 與 data.sql 建立表格與倒資料
spring.sql.init.mode=always

# 讓 Hibernate 不要干擾 Spring 的初始化建表
spring.jpa.hibernate.ddl-auto=none
